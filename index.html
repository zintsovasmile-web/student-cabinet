<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Занятия Анастасии Сергеевны — мои занятия</title>
  
  <style>
    :root{
      --butter:#FBF1BD;
      --paper:#FFFFFF;
      --ink:#23285C;
      --muted:#6F7590;
      --lav:#B5B0E3;
      --sky:#ACD2EF;
      --brush:#5C64CC;
      --line:#E8E4D2;
      --soft-shadow:0 18px 44px rgba(60,57,38,.16);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--ink);
      background:var(--butter);
      font-family:"Open Sans",Arial,sans-serif;
      overflow-x:hidden;
      position:relative;
    }
    body::before,
    body::after{
      content:none;
    }
    body::before{
      width:250px;height:130px;
      left:48px;top:-18px;
      background:var(--lav);
      box-shadow:
        790px 250px 0 0 var(--sky),
        805px 980px 0 0 var(--lav);
    }
    body::after{
      content:none;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:42px 18px 72px;
    }

    .brand{
      font-size:13px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--brush);
    }

    h1,h2,.lesson-title,.lesson-num{
      font-family:"Grotek Dark","Arial Black","Open Sans",Arial,sans-serif;
      color:var(--ink);
    }

    h1{
      margin:10px 0 8px;
      max-width:760px;
      font-size:clamp(42px,7vw,72px);
      line-height:.96;
      letter-spacing:-.045em;
      font-weight:900;
    }

    .muted{color:var(--muted);line-height:1.5}

    .card{
      background:var(--paper);
      border:0;
      border-radius:24px;
      box-shadow:var(--soft-shadow);
    }

    .login{
      position:relative;
      max-width:700px;
      margin:72px auto 40px;
      padding:54px 56px 52px;
      min-height:440px;
    }
    .login::before{
      content:none !important;
      display:none !important;
    }

    input{
      width:100%;
      padding:17px 18px;
      border:2px solid #D9D9E8;
      background:#fffdf6;
      color:var(--ink);
      border-radius:14px;
      font-size:18px;
      font-family:"Open Sans",Arial,sans-serif;
      margin:18px 0 12px;
      outline:none;
    }
    input:focus{
      border-color:var(--brush);
      box-shadow:0 0 0 4px rgba(96,100,207,.12);
    }

    button,.btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:14px;
      padding:14px 20px;
      background:var(--ink);
      color:#fff;
      font-weight:800;
      font-size:15px;
      font-family:"Open Sans",Arial,sans-serif;
      cursor:pointer;
      text-decoration:none;
      transition:.18s ease;
    }
    button:hover,.btn:hover{transform:translateY(-1px)}
    button:disabled{opacity:.5;cursor:wait}
    .error{color:#9a3535;margin-top:12px;font-size:14px}

    .top{
      position:relative;
      background:var(--paper);
      border-radius:28px;
      box-shadow:var(--soft-shadow);
      padding:42px 34px 36px;
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:flex-start;
      margin:40px 0 30px;
    }
    .top::before{
      content:none;
    }
    .top h1{
      font-size:20px;
      line-height:1.2;
      letter-spacing:-.01em;
      margin:10px 0 8px;
      font-weight:800;
    }
    .student{
      font-family:"Grotek Dark","Arial Black","Open Sans",Arial,sans-serif;
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      letter-spacing:-.035em;
      color:var(--ink);
      font-weight:900;
      margin-top:6px;
    }
    .course-resources{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:0 0 16px;
    }
    .course-resources .btn{
      background:#fff;
      color:var(--ink);
      border:2px solid var(--sky);
      box-shadow:none;
    }

    .lesson{
      margin:14px 0;
      padding:0;
      overflow:hidden;
      position:relative;
      border-radius:24px;
    }
    .lesson:nth-child(3n+1)::after,
    .lesson:nth-child(3n+2)::after{
      content:none;
    }

    .lesson-head{
      position:relative;
      z-index:1;
      padding:22px 24px;
      display:grid;
      grid-template-columns:86px 1fr auto 26px;
      gap:16px;
      align-items:center;
      cursor:pointer;
    }

function enrichLocalData(data){
  const copy = JSON.parse(JSON.stringify(data || {}));
  if(!copy.student || !copy.student.id) return copy;

  const studentId = copy.student.id;
  const courses = Array.isArray(copy.courses) ? copy.courses : [];

  // If backend omitted a known fallback course, restore it locally.
  const fallbackStudent = Object.values(FALLBACK_STUDENTS).find(s => s.id === studentId);
  if(fallbackStudent){
    (fallbackStudent.courses || []).forEach(courseId => {
      if(!courses.some(c => c.id === courseId) && FALLBACK_COURSES[courseId]){
        courses.push(JSON.parse(JSON.stringify(FALLBACK_COURSES[courseId])));
      }
    });
  }

  courses.forEach(course => {
    course.resources = Array.isArray(course.resources) ? course.resources : [];
    const localCourse = LOCAL_COURSE_RESOURCES[studentId]?.[course.id] || [];
    localCourse.forEach(r => {
      if(!course.resources.some(x => x.url === r.url)) course.resources.push(r);
    });

    course.lessons = Array.isArray(course.lessons) ? course.lessons : [];
    course.lessons.forEach(lesson => {
      if(!lesson.topic && LOCAL_LESSON_TOPICS[lesson.lessonId]){
        lesson.topic = LOCAL_LESSON_TOPICS[lesson.lessonId];
      }
      lesson.resources = Array.isArray(lesson.resources) ? lesson.resources : [];
      const localLesson = LOCAL_LESSON_RESOURCES[studentId]?.[lesson.lessonId] || [];
      localLesson.forEach(r => {
        if(!lesson.resources.some(x => x.url === r.url)) lesson.resources.push(r);
      });
    });
  });

  // Keep only courses that already have something useful to show.
  copy.courses = courses.filter(c => (c.lessons && c.lessons.length) || (c.resources && c.resources.length));
  copy.lessons = copy.courses.flatMap(c => c.lessons || []);
  return copy;
}


async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function localFallback(code) {
  const hash = await sha256Hex(code);
  const student = FALLBACK_STUDENTS[hash];
  if (!student) return null;
  const courses = (student.courses || [])
    .map(id => JSON.parse(JSON.stringify(FALLBACK_COURSES[id])))
    .filter(Boolean);
  return {
    ok: true,
    student: {id: student.id, name: student.name, groupId: student.groupId},
    courses,
    lessons: courses.flatMap(c => c.lessons || [])
  };
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = '__schoolCb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    const timer = setTimeout(()=>finish(new Error('Сервер не ответил')),2500);

    function finish(err,data){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      script.remove();
      err ? reject(err) : resolve(data);
    }

    window[cb] = data => finish(null,data);
    script.onerror = () => finish(new Error('Не удалось подключиться'));
    script.src = url + (url.includes('?')?'&':'?') + 'callback=' + encodeURIComponent(cb);
    document.body.appendChild(script);
  });
}

async function enter(){
  const code = $('#code').value.trim();
  if(!code) return;

  if(API_URL.includes('PASTE_')){
    errorBox.textContent = 'Сайт уже собран, но ещё не подключён URL backend.';
    return;
  }

  btn.disabled = true;
  errorBox.textContent = '';
  try{
    const data = await jsonp(API_URL + '?code=' + encodeURIComponent(code));
    if(!data.ok){
      const fallback = await localFallback(code);
      if(!fallback) throw new Error(data.error || 'Код не найден');
      localStorage.setItem('schoolCode', code);
      render(fallback);
    }else{
      localStorage.setItem('schoolCode', code);
      render(data);
    }
  }catch(e){
    const fallback = await localFallback(code);
    if(fallback){
      localStorage.setItem('schoolCode', code);
      render(fallback);
      errorBox.textContent = '';
    }else{
      errorBox.textContent = 'Код не найден';
    }
  }finally{
    btn.disabled = false;
  }
}


let CURRENT_DATA = null;

async function apiAction(action, params = {}){
  const code = localStorage.getItem('schoolCode') || '';
  if(!code) throw new Error('Сначала войдите в кабинет');
  const qs = new URLSearchParams({action, code, ...params});
  return jsonp(API_URL + '?' + qs.toString());
}

function localSubmissionKey(studentId, lessonId){
  return `hwDone:${studentId}:${lessonId}`;
}

async function markHomeworkDone(button, studentId, lessonId){
  button.disabled = true;
  button.textContent = 'Отправляю…';
  try{
    const data = await apiAction('submitHomework', {lessonId});
    if(!data.ok) throw new Error(data.error || 'Не удалось отправить');
    localStorage.setItem(localSubmissionKey(studentId, lessonId), '1');
    button.textContent = 'Домашнее задание сдано ✓';
    const status = button.parentElement.querySelector('.homework-status');
    if(status) status.textContent = 'Отмечено как выполненное';
  }catch(e){
    button.disabled = false;
    button.textContent = 'Домашнее задание выполнено';
    alert('Не удалось отметить ДЗ: ' + (e.message || e));
  }
}

async function sendQuestion(button, lessonId){
  const box = button.closest('.question-box');
  const textarea = box.querySelector('textarea');
  const msg = textarea.value.trim();
  if(!msg) return;
  button.disabled = true;
  button.textContent = 'Отправляю…';
  try{
    const data = await apiAction('askQuestion', {lessonId, question: msg});
    if(!data.ok) throw new Error(data.error || 'Не удалось отправить');
    textarea.value = '';
    button.textContent = 'Вопрос отправлен ✓';
    setTimeout(()=>{button.disabled=false;button.textContent='Задать вопрос';},1800);
  }catch(e){
    button.disabled = false;
    button.textContent = 'Задать вопрос';
    alert('Не удалось отправить вопрос: ' + (e.message || e));
  }
}

    const section = document.createElement('section');
    section.className = 'course';

    const courseTitle = course.name || 'Занятия';
    const lessonCount = (course.lessons || []).length;
    const countText = lessonCount
      ? ((course.count && Number(course.count) === Number(lessonCount)) ? `${course.count} занятий` : `${lessonCount} занятий`)
      : ((course.resources || []).length ? 'Материалы курса' : '0 занятий');

    section.innerHTML = `
      <div class="course-head">
        <div class="course-title">${escapeHtml(courseTitle)}</div>
        <div class="course-meta">${escapeHtml(countText)}</div>
      </div>
      <div class="course-resources"></div>
      <div class="course-lessons"></div>
    `;

    const courseResourcesBox = section.querySelector('.course-resources');
    (course.resources || []).forEach(r => {
      courseResourcesBox.insertAdjacentHTML('beforeend',
        `<a class="btn" target="_blank" rel="noopener" href="${escapeAttr(r.url)}">${escapeHtml(r.title)}</a>`
      );
    });

    const lessonsBox = section.querySelector('.course-lessons');

    if(!(course.lessons || []).length && !(course.resources || []).length){
      lessonsBox.innerHTML = `<div class="card course-empty">Занятия этого курса пока не опубликованы.</div>`;
    }

    (course.lessons || []).forEach((lesson, idx)=>{
      const el = document.createElement('article');
      el.className = 'card lesson';

      const allResources = lesson.resources || [];
      const homeworkResources = allResources.filter(r => r.type === 'ДЗ');
      const solutionResources = allResources.filter(r => r.type === 'разбор задач');
      const otherResources = allResources.filter(r => r.type !== 'ДЗ' && r.type !== 'разбор задач');

      const resourceButtons = items => items.map(r =>
        `<a class="btn" target="_blank" rel="noopener" href="${escapeAttr(r.url)}">${escapeHtml(r.title)}</a>`
      ).join('');

      const otherResourcesHtml = resourceButtons(otherResources);
      const homeworkResourcesHtml = resourceButtons(homeworkResources);
      const solutionResourcesHtml = resourceButtons(solutionResources);

      const result = lesson.result ? `
        <div class="result">
          ${lesson.result.attendance ? `<span class="pill">${escapeHtml(lesson.result.attendance)}</span>` : ''}
          ${lesson.result.solved !== null && lesson.result.total !== null ? `<span class="pill">Результат: ${lesson.result.solved}/${lesson.result.total}</span>` : ''}
          ${lesson.result.homeworkStatus ? `<span class="pill">ДЗ: ${escapeHtml(lesson.result.homeworkStatus)}</span>` : ''}
        </div>` : '';

      el.innerHTML = `
        <div class="lesson-head">
          <div class="lesson-num">Занятие ${escapeHtml(String(lesson.number ?? ''))}</div>
          <div class="lesson-title">${escapeHtml(lesson.topic || 'Тема появится позже')}</div>
          <div class="lesson-date">${escapeHtml(lesson.date || '')}</div>
          <div class="chev">⌄</div>
        </div>
        <div class="lesson-body">
          ${lesson.materialOpen && lesson.material
            ? `<div class="material">${escapeHtml(lesson.material)}</div>`
            : `<div class="empty">Материал занятия пока не опубликован.</div>`}
          ${otherResourcesHtml ? `<div class="resources">${otherResourcesHtml}</div>` : ''}

          ${(lesson.homework || homeworkResourcesHtml) ? `
            <div class="lesson-section homework-section">
              <div class="lesson-section-title">Домашнее задание</div>
              ${lesson.homework ? `<div>${escapeHtml(lesson.homework)}</div>` : ''}
              ${homeworkResourcesHtml ? `<div class="resources">${homeworkResourcesHtml}</div>` : ''}
              <div class="homework-actions">
                <button class="done-btn homework-done"
                        data-student="${escapeAttr(data.student.id)}"
                        data-lesson="${escapeAttr(lesson.lessonId)}">
                  Домашнее задание выполнено
                </button>
                <span class="homework-status"></span>
              </div>
              <div class="question-box">
                <textarea placeholder="Есть вопрос по домашнему заданию? Напишите его здесь."></textarea>
                <div class="question-row">
                  <button class="question-send" data-lesson="${escapeAttr(lesson.lessonId)}">Задать вопрос</button>
                </div>
                ${(lesson.questions || []).filter(q=>q.answer).map(q=>`
                  <div class="teacher-answer"><strong>Ответ преподавателя:</strong> ${escapeHtml(q.answer)}</div>
                `).join('')}
              </div>
            </div>` : ''}

          ${solutionResourcesHtml ? `
            <div class="lesson-section">
              <div class="lesson-section-title">Разборы задач с занятия</div>
              <div class="resources">${solutionResourcesHtml}</div>
            </div>` : ''}

          ${result}
        </div>
      `;
      el.querySelector('.lesson-head').addEventListener('click',()=>el.classList.toggle('open'));

      const doneBtn = el.querySelector('.homework-done');
      if(doneBtn){
        const alreadyDone = Boolean(lesson.homeworkSubmission && lesson.homeworkSubmission.status === 'сдано')
          || localStorage.getItem(localSubmissionKey(data.student.id, lesson.lessonId)) === '1';
        if(alreadyDone){
          doneBtn.disabled = true;
          doneBtn.textContent = 'Домашнее задание сдано ✓';
          const s = el.querySelector('.homework-status');
          if(s) s.textContent = 'Отмечено как выполненное';
        }else{
          doneBtn.addEventListener('click',()=>markHomeworkDone(doneBtn, data.student.id, lesson.lessonId));
        }
      }

      const qBtn = el.querySelector('.question-send');
      if(qBtn){
        qBtn.addEventListener('click',()=>sendQuestion(qBtn, lesson.lessonId));
      }

      lessonsBox.appendChild(el);
    });

    box.appendChild(section);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

$('#loginBtn').addEventListener('click', enter);
$('#code').addEventListener('keydown', e=>{if(e.key==='Enter') enter()});
$('#logoutBtn').addEventListener('click',()=>{
  localStorage.removeItem('schoolCode');
  dashboard.hidden = true;
  login.hidden = false;
  $('#code').value = '';
});

const saved = localStorage.getItem('schoolCode');
if(saved){
  $('#code').value = saved;
  enter();
}
</script>
</body>
</html>
